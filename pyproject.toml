[project]
name = "pilot-ux"
version = "0.1.0"
description = "Test any UX like real first-time users, then fix it with your coding agent before shipping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2,<2",
  "playwright>=1.48",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3"]
voyage = ["voyageai>=0.2"]

[project.scripts]
pilot = "pilot_ux.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot_ux"]

[tool.hatch.build.targets.wheel.force-include]
"personas" = "pilot_ux/_data/personas"
"anchors" = "pilot_ux/_data/anchors"
"skills/pilot/templates" = "pilot_ux/_data/templates"
"skills/pilot/claude-design" = "pilot_ux/_data/claude-design"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
