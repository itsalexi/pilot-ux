[project]
name = "ux-swarm"
version = "0.1.0"
description = "Synthetic-user UX testing: blind, screenshot-only persona agents run by Claude Code, with SSR attitude scoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2,<2",
  "playwright>=1.48",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3"]
voyage = ["voyageai>=0.2"]

[project.scripts]
ux-swarm = "ux_swarm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ux_swarm"]

[tool.hatch.build.targets.wheel.force-include]
"personas" = "ux_swarm/_data/personas"
"anchors" = "ux_swarm/_data/anchors"
"skills/ux-swarm/templates" = "ux_swarm/_data/templates"
"skills/ux-swarm/claude-design" = "ux_swarm/_data/claude-design"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
