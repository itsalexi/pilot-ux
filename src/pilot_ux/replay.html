<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Session replay</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f7f4;
      --ink: #202124;
      --muted: #626363;
      --line: #dfdfdb;
      --blue: #155aa5;
      --wash: #edf4fb;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body, h1, h2, p, figure { margin: 0; }
    [hidden] { display: none !important; }
    button, input { font: inherit; }
    button { border: 0; padding: 0; color: inherit; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled, input:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    svg { display: block; width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .shell { max-width: 1140px; margin: 0 auto; padding: 0 clamp(20px,4vw,56px) 36px; }
    .top, .breadcrumb, .section-head, .tools, .buttons, .phase, .timebar, .sheet-head, .lightbox header { display: flex; align-items: center; }
    .top { min-height: 66px; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .breadcrumb { min-width: 0; gap: 10px; font-size: 14px; line-height: 1.4; }
    .breadcrumb span:first-child { overflow-wrap: anywhere; color: var(--muted); }
    .breadcrumb svg { width: 12px; height: 12px; color: #828381; }
    .breadcrumb strong { font-weight: 600; }
    .library, .text-button, .icon-button, .close { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 8px; }
    .library { font-size: 14px; font-weight: 550; padding: 0 10px; margin-right: -10px; }
    .library svg { width: 17px; height: 17px; }
    .library:hover, .text-button:hover, .icon-button:not(:disabled):hover, .close:hover { background: #eaeae6; }
    .session-info { padding: clamp(24px,4vh,40px) 0 clamp(22px,3vh,32px); }
    h1 { max-width: 32em; font-size: clamp(21px,2.2vw,30px); line-height: 1.25; letter-spacing: -.026em; font-weight: 600; overflow-wrap: anywhere; text-wrap: pretty; }
    .speaker { margin-top: 9px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .speaker strong { color: var(--ink); font-weight: 550; }
    .workspace { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: clamp(24px,5vw,70px); align-items: start; }
    .capture-pane { min-width: 0; --capture-height: clamp(250px,calc(100svh - 374px),575px); }
    .section-head { justify-content: space-between; gap: 8px; min-height: 52px; }
    h2 { font-size: 17px; line-height: 1.25; font-weight: 620; letter-spacing: -.015em; }
    .tools { gap: 4px; }
    .phase { padding: 2px; border: 1px solid #d9d9d5; border-radius: 8px; background: #eeedea; }
    .phase button { min-width: 50px; min-height: 30px; padding: 0 10px; font-size: 12px; font-weight: 550; color: var(--muted); border-radius: 5px; }
    .phase button[aria-pressed="true"] { color: var(--ink); background: white; box-shadow: 0 1px 3px #16191b24; }
    .icon-button, .close { width: 44px; }
    .stage { min-height: var(--capture-height); margin: 13px 0 10px; display: grid; place-items: center; }
    .device, .enlarged { display: block; position: relative; max-width: 100%; width: fit-content; }
    .device { cursor: zoom-in; border-radius: 3px; box-shadow: 0 0 0 1px #23262524, 0 3px 12px #25262909; }
    .device img, .enlarged img { display: block; width: auto; height: auto; max-width: 100%; }
    .device img { max-height: var(--capture-height); border-radius: inherit; }
    .pin { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #155aa533; border: 2px solid var(--blue); box-shadow: 0 0 0 2px white; transform: translate(-50%,-50%); pointer-events: none; }
    .no-image, #empty-study { color: var(--muted); font-size: 15px; text-align: center; }
    #empty-study { padding: 45px 8px; }
    .transport { max-width: 400px; margin: 0 auto; }
    .buttons { gap: 7px; justify-content: center; }
    .timebar { gap: 10px; }
    .clock, .stamp, #counter { font-variant-numeric: tabular-nums; }
    .clock { min-width: 3ch; text-align: center; font-size: 12px; color: var(--muted); }
    .track { display: flex; align-items: center; position: relative; height: 36px; flex: 1; min-width: 24px; }
    .segments { display: flex; gap: 2px; margin: 0 6px; width: calc(100% - 12px); height: 4px; overflow: hidden; border-radius: 2px; }
    .segments span { flex: 1; background: #ccccc9; }
    .segments .played { background: var(--blue); }
    .range { position: absolute; inset: 0; display: block; width: 100%; height: 100%; margin: 0; appearance: none; -webkit-appearance: none; cursor: pointer; background: transparent; }
    .range::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    .range::-moz-range-track { height: 4px; background: transparent; }
    .range::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -4px; appearance: none; -webkit-appearance: none; background: var(--blue); border: 2px solid var(--paper); border-radius: 50%; }
    .range::-moz-range-thumb { width: 9px; height: 9px; background: var(--blue); border: 2px solid var(--paper); border-radius: 50%; }
    #play { border-radius: 50%; background: var(--ink); color: white; }
    #play:not(:disabled):hover { background: #424448; }
    #play .pause-path, #play[aria-pressed="true"] .play-path { display: none; }
    #play[aria-pressed="true"] .pause-path { display: block; }
    .transcript-panel { min-width: 0; }
    .text-button { color: var(--blue); font-size: 13px; font-weight: 550; padding: 0 8px; margin-right: -8px; }
    .stream { max-height: clamp(290px,calc(100svh - 276px),650px); overflow: auto; overscroll-behavior: contain; padding: 4px; margin-top: 5px; background: white; border: 1px solid var(--line); border-radius: 14px; scrollbar-width: thin; }
    .entry { display: grid; width: 100%; grid-template-columns: minmax(0,1fr) auto; align-content: start; gap: 6px 12px; text-align: left; padding: 16px 17px; position: relative; border-radius: 9px; }
    .entry + .entry::before { content: ''; height: 1px; position: absolute; top: -1px; left: 17px; right: 17px; background: #ededea; }
    .entry[aria-current]::before, .entry[aria-current] + .entry::before { display: none; }
    .entry:hover, .row:hover { background: #f5f5f2; }
    .entry[aria-current], .row[aria-current] { background: var(--wash); }
    .entry[aria-current] .entry-action, .entry[aria-current] .stamp { color: var(--blue); }
    .entry-action { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 18px; }
    .entry[aria-current] .entry-action::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--blue); }
    .stamp { color: var(--muted); font-size: 12px; line-height: 18px; }
    .speech { grid-column: 1/-1; color: #353637; font-size: 15px; line-height: 1.48; overflow-wrap: anywhere; white-space: pre-wrap; }
    .entry[aria-current] .speech { color: var(--ink); }
    .text-button, .stamp, .entry-action, .row-detail { letter-spacing: 0; }
    .entry:focus-visible, .row:focus-visible { outline-offset: -2px; }
    .panel-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    #counter { font-size: 12px; color: var(--muted); }
    dialog { color: var(--ink); font: inherit; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 15px 70px #20212425; width: min(500px,calc(100% - 32px)); padding: 0; max-height: 86svh; }
    dialog::backdrop { background: #20242352; }
    .sheet { display: flex; flex-direction: column; max-height: 82svh; }
    .sheet-head, .lightbox header { justify-content: space-between; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
    .close svg { width: 16px; height: 16px; }
    .sheet-scroll { overflow: auto; overscroll-behavior: contain; padding: 6px; }
    .row { display: flex; align-items: center; width: 100%; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 9px; }
    .row-copy { display: grid; flex: 1; min-width: 0; gap: 3px; }
    .row-title { font-size: 15px; font-weight: 600; }
    .row-detail { font-size: 13px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
    .row .check { color: var(--blue); visibility: hidden; }
    .row[aria-current] .check { visibility: visible; }
    .zoom { width: fit-content; max-width: calc(100% - 20px); max-height: calc(100svh - 20px); }
    .lightbox header { font-size: 13px; color: var(--muted); }
    .enlarged { margin: 12px auto; }
    .enlarged img { max-height: calc(100svh - 112px); max-width: min(calc(100vw - 44px),1200px); }
    @media (max-width: 760px) {
      .shell { padding-inline: 20px; }
      .workspace { gap: 22px; }
      .entry { padding: 13px 12px; }
    }
    @media (max-width: 620px) {
      .shell { padding: 0 18px 22px; max-width: 520px; }
      .top { min-height: 49px; }
      .session-info { padding: 16px 0 14px; }
      h1 { font-size: 20px; line-height: 1.26; }
      .speaker { margin-top: 6px; font-size: 13px; }
      .workspace { display: block; }
      .capture-pane { --capture-height: clamp(205px,43svh,420px); }
      .section-head { min-height: 44px; }
      .phase button { min-height: 38px; }
      .phase { margin: 0; }
      .stage { margin: 9px 0 3px; }
      .timebar { gap: 8px; }
      .track { height: 30px; }
      .buttons { gap: 8px; }
      .transcript-panel { margin-top: 11px; }
      .stream { max-height: none; overflow: hidden; padding: 0; margin-top: 1px; background: white; }
      .stream .entry:not([aria-current]) { display: none; }
      .stream .entry[aria-current] { background: white; }
      .stream .entry { padding: 13px 15px; }
    }
    @media (pointer: coarse) {
      .phase button { min-height: 40px; }
      .track::before { content: ''; position: absolute; inset: -4px 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .entry, .row, .icon-button, .text-button, .phase button { transition: background-color .14s ease; }
    }
  </style>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="stack" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M6 3.5h12M7 11h5"/></symbol>
    <symbol id="arrows" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6m0 6 7-7"/></symbol>
    <symbol id="lines" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h8"/></symbol>
    <symbol id="cross" viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9"/></symbol>
    <symbol id="tick" viewBox="0 0 20 20"><path d="m3.5 10 4.2 4 8.8-9"/></symbol>
    <symbol id="prev-shape" viewBox="0 0 22 22"><path d="M5 5.2v11.6" stroke-width="2.3"/><path d="M16.8 5.7a1 1 0 0 0-1.5-.9L6.8 10a1.1 1.1 0 0 0 0 2l8.5 5.2a1 1 0 0 0 1.5-.9z" fill="currentColor" stroke="none"/></symbol>
  </svg>
  <div class="shell">
    <header class="top">
      <div class="breadcrumb"><span id="study-name"></span><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg><strong>Replay</strong></div>
      <button class="library" id="library" aria-haspopup="dialog" hidden><svg aria-hidden="true"><use href="#stack"/></svg>Sessions</button>
    </header>
    <main>
      <p id="empty-study" hidden>No recorded steps are available for this study.</p>
      <div id="player" hidden>
        <header class="session-info">
          <h1 id="goal"></h1>
          <p class="speaker"><strong id="persona"></strong> · Synthetic participant<span id="run"></span></p>
        </header>
        <div class="workspace">
          <section class="capture-pane" aria-labelledby="screen-title">
            <div class="section-head">
              <h2 id="screen-title">Screen</h2>
              <div class="tools">
                <div class="phase" id="phase-switch" role="group" aria-label="Screenshot timing"><button id="before">Before</button><button id="after">After</button></div>
                <button class="icon-button" id="expand" title="Expand screen" aria-label="Expand screen"><svg aria-hidden="true"><use href="#arrows"/></svg></button>
              </div>
            </div>
            <div class="stage">
              <button class="device" id="capture" aria-label="Expand current screenshot"><img id="screen" alt=""><span class="pin" id="pin" aria-hidden="true" hidden></span></button>
              <p class="no-image" id="empty-screen" hidden>No screenshot was recorded for this frame.</p>
            </div>
            <div class="transport" role="group" aria-label="Playback controls">
              <div class="timebar"><span class="clock" id="elapsed"></span><label class="track"><span id="segments" class="segments" aria-hidden="true"></span><input class="range" id="scrubber" type="range" min="0" value="0" step="1" aria-label="Scrub recorded steps"></label><span class="clock" id="duration"></span></div>
              <div class="buttons">
                <button class="icon-button" id="previous" title="Previous step (left arrow)" aria-label="Previous step"><svg aria-hidden="true"><use href="#prev-shape"/></svg></button>
                <button class="icon-button" id="play" title="Play or pause (space)" aria-label="Play" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" stroke="none"><path class="play-path" style="fill:currentColor;stroke:none" d="M4 3.8a1.2 1.2 0 0 1 1.8-1l11 6.2a1.1 1.1 0 0 1 0 2l-11 6.2a1.2 1.2 0 0 1-1.8-1z"/><path class="pause-path" style="fill:currentColor;stroke:none" d="M4 3h4v14H4zm8 0h4v14h-4z"/></svg></button>
                <button class="icon-button" id="next" title="Next step (right arrow)" aria-label="Next step"><svg aria-hidden="true" style="transform:rotate(180deg)"><use href="#prev-shape"/></svg></button>
              </div>
            </div>
          </section>
          <section class="transcript-panel" aria-labelledby="transcript-heading">
            <div class="section-head">
              <div class="panel-title"><h2 id="transcript-heading">Transcript</h2><span id="counter" aria-live="polite" aria-atomic="true"></span></div>
              <button class="text-button" id="transcript" aria-haspopup="dialog">All steps</button>
            </div>
            <div class="stream" id="stream"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <dialog id="session-sheet" aria-labelledby="sessions-title"><div class="sheet"><div class="sheet-head"><h2 id="sessions-title">Sessions</h2><button class="close" data-close aria-label="Close sessions"><svg aria-hidden="true"><use href="#cross"/></svg></button></div><div class="sheet-scroll sheet-list" id="sessions"></div></div></dialog>
  <dialog id="transcript-sheet" aria-labelledby="transcript-title"><div class="sheet"><div class="sheet-head"><h2 id="transcript-title">Transcript</h2><button class="close" data-close aria-label="Close transcript"><svg aria-hidden="true"><use href="#cross"/></svg></button></div><div class="sheet-scroll sheet-list" id="entries"></div></div></dialog>
  <dialog class="zoom" id="dialog" aria-label="Expanded device capture"><div class="lightbox"><header><span id="expanded-caption"></span><button class="close" data-close aria-label="Close expanded capture"><svg aria-hidden="true"><use href="#cross"/></svg></button></header><figure class="enlarged"><img id="expanded" alt=""><span class="pin" id="expanded-pin" aria-hidden="true" hidden></span></figure></div></dialog>
  <script type="application/json" id="replay-data">__UX_REPLAY_DATA__</script>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      const data = JSON.parse(el("replay-data").textContent);
      const sessions = data.sessions.filter(item => item.steps.length);
      const actions = {look:"Look",tap:"Tap",scroll:"Scroll",type_text:"Type",back:"Back",done:"Done",give_up:"Give up"};
      const actionName = tool => actions[tool] || String(tool).replaceAll("_", " ");
      const imageURL = index => Number.isInteger(index) && /^data:image\/(png|jpeg|webp|gif);base64,/i.test(data.images[index]) ? data.images[index] : null;
      const clock = time => Number.isFinite(time) ? Math.floor(time / 60) + ":" + String(Math.floor(time % 60)).padStart(2,"0") : "";
      function title(name) {
        if (!/^[a-z\d]+(?:[-_][a-z\d]+)+$/i.test(name)) return name;
        const words = name.replace(/[-_]/g," ");
        return words[0].toUpperCase() + words.slice(1);
      }
      function node(tag, className, value) {
        const item = document.createElement(tag);
        item.className = className;
        if (value !== undefined) item.textContent = value;
        return item;
      }
      function checkIcon() {
        const icon = document.createElementNS("http://www.w3.org/2000/svg","svg");
        icon.setAttribute("class","check");
        icon.setAttribute("aria-hidden","true");
        const use = document.createElementNS(icon.namespaceURI,"use");
        use.setAttribute("href","#tick");
        icon.append(use);
        return icon;
      }
      function setCurrent(item, current, token) {
        if (current) item.setAttribute("aria-current", token);
        else item.removeAttribute("aria-current");
      }
      let session, position = 0, phase, playing = false, timeout;
      el("study-name").textContent = title(data.title);
      if (data.title) document.title = title(data.title) + " · Replay";
      if (!sessions.length) {
        el("empty-study").hidden = false;
        return;
      }
      el("player").hidden = false;
      el("library").hidden = false;
      sessions.forEach(item => {
        const row = node("button","row");
        const label = node("span","row-copy");
        const repeat = item.id.match(/__r(\d+)$/);
        label.append(node("span","row-title",item.persona),node("span","row-detail",
          [title(item.task),repeat && "Run " + repeat[1],item.outcome].filter(Boolean).join(" · ")));
        row.append(label,checkIcon());
        row.addEventListener("click", () => {
          el("session-sheet").close();
          openSession(item,0);
        });
        el("sessions").append(row);
      });
      function openSession(item, start) {
        pause();
        session = item;
        el("persona").textContent = item.persona;
        el("goal").textContent = item.goal || title(item.task);
        const repeat = item.id.match(/__r(\d+)$/);
        el("run").textContent = repeat ? " · Run " + repeat[1] : "";
        el("scrubber").max = item.steps.length - 1;
        [...el("sessions").children].forEach((row,i) => setCurrent(row,sessions[i] === item,"true"));
        const entries = el("entries"), stream = el("stream"), segments = el("segments");
        entries.replaceChildren();
        stream.replaceChildren();
        segments.replaceChildren();
        item.steps.forEach((step,i) => {
          if (i > 0 || item.steps.length === 1) segments.append(node("span",""));
          for (const list of [stream,entries]) {
            const row = node("button","entry");
            const action = "Step " + (i + 1) + " · " + actionName(step.tool);
            row.append(node("span","entry-action",action),node("span","stamp",clock(step.time)),
              node("span","speech",step.say || "No spoken comment recorded."));
            row.addEventListener("click",() => {
              if (list === entries) el("transcript-sheet").close();
              seek(i);
            });
            list.append(row);
          }
        });
        seek(start);
      }
      function useHash() {
        const hash = new URLSearchParams(location.hash.slice(1));
        const linked = hash.has("session") || hash.has("step");
        const id = linked ? hash.get("session") : data.start?.session;
        const step = linked ? (hash.has("step") ? Number(hash.get("step")) : NaN) : data.start?.step;
        const selected = sessions.find(item => item.id === id) || sessions[0];
        openSession(selected, Math.max(0,selected.steps.findIndex(row => row.i === step)));
      }
      function updateHash() {
        const hash = new URLSearchParams({session: session.id, step: session.steps[position].i});
        try { history.replaceState(null,"","#" + hash); } catch { /* Some local and embedded documents restrict URL changes. */ }
      }
      function setMarker(pin, step, before) {
        const valid = [step.x,step.y].every(v => Number.isFinite(v) && v >= 0 && v <= 1);
        pin.hidden = !(before && step.tool === "tap" && valid);
        if (!pin.hidden) {
          pin.style.left = step.x * 100 + "%";
          pin.style.top = step.y * 100 + "%";
        }
      }
      function showCapture() {
        const step = session.steps[position];
        const before = phase === "before";
        const src = imageURL(before ? step.before : step.image);
        const screen = el("screen");
        if (src) {
          if (screen.getAttribute("src") !== src) screen.src = src;
          screen.alt = (before ? "Before" : "After") + " action · " + actionName(step.tool) + " · Step " + (position + 1);
        } else screen.removeAttribute("src");
        el("empty-screen").hidden = Boolean(src);
        el("capture").hidden = !src;
        el("expand").disabled = !src;
        el("phase-switch").hidden = !imageURL(step.before);
        el("before").setAttribute("aria-pressed",String(before));
        el("after").setAttribute("aria-pressed",String(!before));
        setMarker(el("pin"),step,before);
      }
      function render() {
        const step = session.steps[position];
        const count = session.steps.length;
        const current = "Step " + (position + 1) + " of " + count;
        el("counter").textContent = current;
        const startTime = clock(step.time), endTime = clock(session.steps[count - 1].time);
        el("elapsed").textContent = startTime && endTime ? startTime : String(position + 1);
        el("duration").textContent = startTime && endTime ? endTime : String(count);
        const slider = el("scrubber");
        slider.value = position;
        slider.disabled = count < 2;
        slider.setAttribute("aria-valuetext", current);
        el("previous").disabled = position === 0;
        el("next").disabled = position === count - 1;
        el("play").disabled = count < 2;
        [...el("segments").children].forEach((segment,i) => segment.classList.toggle("played",i < position));
        const stream = el("stream");
        el("quote")?.removeAttribute("id");
        [stream, el("entries")].forEach(list => [...list.children].forEach((row,i) => setCurrent(row,i === position,"step")));
        const active = stream.children[position];
        active.querySelector(".speech").id = "quote";
        requestAnimationFrame(() => {
          if (stream.scrollHeight <= stream.clientHeight || !active.isConnected) return;
          const center = active.getBoundingClientRect().top + active.clientHeight / 2;
          stream.scrollTop += center - stream.getBoundingClientRect().top - stream.clientHeight / 2;
        });
        showCapture();
        updateHash();
      }
      function seek(index, stop = true) {
        if (stop) pause();
        position = Math.max(0,Math.min(session.steps.length - 1,index));
        const step = session.steps[position];
        phase = imageURL(step.before) && (step.tool === "tap" || !imageURL(step.image)) ? "before" : "after";
        render();
      }
      function pause() {
        playing = false;
        clearTimeout(timeout);
        el("play").setAttribute("aria-pressed","false");
        el("play").setAttribute("aria-label","Play");
      }
      function schedule() {
        const step = session.steps[position];
        if (phase === "before" && imageURL(step.image)) {
          timeout = setTimeout(() => { phase = "after"; showCapture(); schedule(); },850);
          return;
        }
        const delay = Math.max(2400,Math.min(8000,(step.say || "").length * 38));
        timeout = setTimeout(() => {
          if (position === session.steps.length - 1) { pause(); return; }
          seek(position + 1,false);
          schedule();
        },delay);
      }
      function togglePlay() {
        if (playing) { pause(); return; }
        if (session.steps.length < 2) return;
        if (position === session.steps.length - 1) seek(0);
        playing = true;
        el("play").setAttribute("aria-pressed","true");
        el("play").setAttribute("aria-label","Pause");
        schedule();
      }
      el("scrubber").addEventListener("input", e => seek(Number(e.target.value)));
      el("play").addEventListener("click",togglePlay);
      el("previous").addEventListener("click",() => seek(position - 1));
      el("next").addEventListener("click",() => seek(position + 1));
      for (const id of ["before","after"]) {
        el(id).addEventListener("click",() => { pause(); phase = id; showCapture(); });
      }
      function openSheet(id) {
        pause();
        const sheet = el(id);
        sheet.showModal();
        const current = sheet.querySelector("[aria-current]");
        if (current) current.scrollIntoView({block:"nearest"});
      }
      el("library").addEventListener("click", () => openSheet("session-sheet"));
      el("transcript").addEventListener("click", () => openSheet("transcript-sheet"));
      function expandCapture() {
        pause();
        el("expanded").src = el("screen").src;
        el("expanded").alt = el("screen").alt;
        el("expanded-caption").textContent = el("screen").alt;
        setMarker(el("expanded-pin"),session.steps[position],phase === "before");
        el("dialog").showModal();
      }
      el("capture").addEventListener("click",expandCapture);
      el("expand").addEventListener("click",expandCapture);
      document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click",() => button.closest("dialog").close()));
      document.querySelectorAll("dialog").forEach(dialog => dialog.addEventListener("click",e => {
        if (e.target !== dialog) return;
        const bounds = dialog.getBoundingClientRect();
        if (e.clientX < bounds.left || e.clientX > bounds.right || e.clientY < bounds.top || e.clientY > bounds.bottom) dialog.close();
      }));
      document.addEventListener("keydown", e => {
        if (document.querySelector("dialog[open]") || e.altKey || e.metaKey || e.ctrlKey || e.target.closest("input,textarea,select")) return;
        if (e.key === "ArrowLeft") { e.preventDefault(); seek(position - 1); }
        if (e.key === "ArrowRight") { e.preventDefault(); seek(position + 1); }
        if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); togglePlay(); }
      });
      document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
      addEventListener("hashchange",useHash);
      useHash();
    })();
  </script>
</body>
</html>
